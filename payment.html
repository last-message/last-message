<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top,#b00000,#400000 40%,#050505);

color:white;

display:flex;
justify-content:center;
align-items:center;

}


.container{

width:90%;
max-width:700px;

text-align:center;

}



.symbol{

font-size:55px;

text-shadow:0 0 30px red;

}



h1{

font-family:'Space Grotesk',sans-serif;

font-size:55px;

letter-spacing:-2px;

margin:25px 0;

}



.subtitle{

font-size:22px;

color:#ddd;

}



.card{

margin-top:40px;

padding:40px 30px;

background:rgba(255,255,255,.09);

border:1px solid rgba(255,255,255,.25);

border-radius:30px;

backdrop-filter:blur(20px);

}



.amount{

font-size:65px;

font-weight:900;

}



.network{

margin:20px 0;

font-size:20px;

font-weight:700;

color:#ffbbbb;

}



.address{

background:rgba(0,0,0,.4);

padding:20px;

border-radius:15px;

word-break:break-all;

font-size:16px;

}



button{

margin-top:25px;

padding:18px 40px;

border:0;

border-radius:50px;

font-size:18px;

font-weight:900;

cursor:pointer;

background:white;

color:#700000;

}



.status{

margin-top:35px;

font-size:18px;

color:#ddd;

}



.footer{

margin-top:40px;

color:#aaa;

font-size:14px;

}



</style>

</head>


<body>


<div class="container">


<div class="symbol">
◈ ✦ ∞
</div>


<h1>
UNLOCK MESSAGE
</h1>


<div class="subtitle">
One payment. One hidden message.
</div>



<div class="card">


<div class="amount">
$2
</div>


<div class="network">
USDT • TRC20 NETWORK
</div>


<p>
Send exactly 2 USDT to:
</p>


<div class="address" id="wallet">

TDq9HhTWvAB1Pft7pum4Ty5k9Kyb2adHdx

</div>


<button onclick="copyWallet()">

COPY WALLET ADDRESS

</button>


<div class="status">

◉ Waiting for payment confirmation...

</div>


</div>



<div class="footer">

Secure human message archive ∞

</div>


</div>



<script>

function copyWallet(){

navigator.clipboard.writeText(
"TDq9HhTWvAB1Pft7pum4Ty5k9Kyb2adHdx"
);

alert("Wallet address copied");

}

</script>


</body>
</html>
