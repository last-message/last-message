<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leave Your Message</title><style>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;

font-family:
Arial,
Helvetica,
sans-serif;

background:
radial-gradient(
circle at top,
#b30000 0%,
#4a0000 36%,
#080808 100%
);

color:#fff;

display:flex;
justify-content:center;

padding:
50px 20px 70px;
}

.container{
width:100%;
max-width:900px;
}

.symbol{
text-align:center;
font-size:58px;

text-shadow:
0 0 35px rgba(255,0,0,.8);

margin-bottom:12px;
}

.logo{
text-align:center;

font-size:12px;
letter-spacing:7px;

color:#ffbcbc;

margin-bottom:20px;
}

h1{
text-align:center;

font-size:
clamp(38px,6vw,58px);

font-weight:900;

margin:
15px 0 10px;

letter-spacing:-1px;

text-shadow:
0 0 25px rgba(255,0,0,.55);
}

.subtitle{
text-align:center;

color:#d6d6d6;

font-size:
clamp(15px,2vw,18px);

margin-bottom:38px;
}

.card{
width:100%;

padding:
42px clamp(22px,5vw,55px);

background:
rgba(255,255,255,.085);

border:
1px solid rgba(255,255,255,.20);

border-radius:32px;

backdrop-filter:
blur(22px);

-webkit-backdrop-filter:
blur(22px);

box-shadow:
0 25px 90px rgba(0,0,0,.65);
}

/* =========================
   ORDER ID
========================= */

.order-card{

width:100%;

padding:
15px 18px;

margin-bottom:32px;

border-radius:18px;

background:
rgba(0,0,0,.28);

border:
1px solid rgba(255,255,255,.13);

display:flex;

align-items:center;

justify-content:
space-between;

gap:15px;
}

.order-label{

font-size:12px;

font-weight:700;

letter-spacing:1.5px;

text-transform:uppercase;

color:#aaa;

white-space:nowrap;
}

.order-value{

font-family:
monospace;

font-size:
clamp(11px,1.8vw,14px);

color:#eee;

word-break:break-all;

text-align:right;

opacity:.9;
}

/* =========================
   FORM
========================= */

label{

display:block;

font-size:14px;

font-weight:700;

margin-bottom:9px;

color:#f3cccc;
}

.field{

width:100%;

padding:
17px 18px;

margin-bottom:23px;

border-radius:15px;

border:
1px solid rgba(255,255,255,.18);

background:
rgba(0,0,0,.34);

color:#fff;

font-size:16px;

outline:none;

transition:
border-color .2s,
box-shadow .2s,
background .2s;
}

.field:hover{

background:
rgba(0,0,0,.42);
}

.field:focus{

border-color:
rgba(255,145,145,.75);

background:
rgba(0,0,0,.48);

box-shadow:
0 0 0 3px
rgba(255,0,0,.08);
}

.field::placeholder{

color:#858585;
}

.row{

display:grid;

grid-template-columns:
1fr 1fr;

gap:22px;
}

.message-header{

display:flex;

justify-content:
space-between;

align-items:center;

margin-top:3px;

margin-bottom:9px;
}

.message-label{

font-size:14px;

font-weight:700;

color:#f3cccc;
}

.counter{

font-size:13px;

color:#8f8f8f;

font-variant-numeric:
tabular-nums;
}

.counter.warning{

color:#ff9d9d;
}

/* =========================
   BIG MESSAGE BOX
========================= */

.message-box{

width:100%;

min-height:380px;

height:380px;

resize:vertical;

padding:
22px 20px;

margin-bottom:24px;

line-height:1.75;

font-size:17px;

border-radius:18px;

border:
1px solid rgba(255,255,255,.20);

background:
rgba(0,0,0,.38);

color:white;

outline:none;

font-family:
Arial,
Helvetica,
sans-serif;

transition:
border-color .2s,
box-shadow .2s;
}

.message-box:focus{

border-color:
rgba(255,145,145,.75);

box-shadow:
0 0 0 3px
rgba(255,0,0,.08);
}

.message-box::placeholder{

color:#777;
}

/* =========================
   BUTTON
========================= */

.submit{

width:100%;

padding:
20px 25px;

border:none;

border-radius:60px;

background:#fff;

color:#680000;

font-size:
clamp(17px,2vw,20px);

font-weight:900;

letter-spacing:.3px;

cursor:pointer;

box-shadow:
0 10px 35px
rgba(0,0,0,.35);

transition:
transform .2s,
box-shadow .2s,
opacity .2s;
}

.submit:hover{

transform:
translateY(-2px);

box-shadow:
0 14px 40px
rgba(0,0,0,.45);
}

.submit:active{

transform:
translateY(0);
}

.submit:disabled{

opacity:.5;

cursor:not-allowed;

transform:none;
}

.status{

min-height:25px;

margin-top:20px;

text-align:center;

font-size:15px;

color:#ddd;

line-height:1.5;
}

.notice{

margin-top:25px;

padding:
17px 20px;

border-radius:15px;

background:
rgba(0,0,0,.22);

border:
1px solid rgba(255,255,255,.08);

color:#999;

font-size:12px;

line-height:1.6;

text-align:center;
}

/* =========================
   TABLET
========================= */

@media(max-width:700px){

body{

padding:
30px 14px 50px;
}

.container{

max-width:
600px;
}

.symbol{

font-size:48px;
}

.logo{

font-size:10px;

letter-spacing:5px;
}

.card{

padding:
30px 20px;

border-radius:26px;
}

.row{

grid-template-columns:
1fr;

gap:0;
}

.order-card{

align-items:
flex-start;

flex-direction:
column;

gap:7px;

padding:
14px 16px;
}

.order-value{

text-align:left;

width:100%;
}

.message-box{

height:330px;

min-height:330px;

font-size:16px;

padding:19px;
}

}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:420px){

body{

padding:
22px 10px 40px;
}

.symbol{

font-size:42px;
}

h1{

margin-top:10px;
}

.subtitle{

margin-bottom:28px;
}

.card{

padding:
25px 16px;

border-radius:22px;
}

.field{

padding:
16px;

font-size:16px;
}

.message-box{

height:300px;

min-height:300px;

padding:
17px;

font-size:16px;

line-height:1.7;
}

.submit{

padding:
19px 15px;
}

}

</style></head><body><div class="container"><div class="symbol">
◈ ✦ ∞
</div><div class="logo">
GLOBAL HUMAN CONNECTION
</div><h1>
YOUR MESSAGE
</h1><div class="subtitle">
Leave something for the next person.
</div><div class="card"><div class="order-card"><div class="order-label">
Order ID
</div><div
id="orderDisplay"
class="order-value"
>
—
</div></div><form
id="messageForm"
novalidate
><div class="row"><div><label for="name">
Name
</label><input
id="name"
class="field"
type="text"
name="name"
placeholder="Your name"
maxlength="100"
required
autocomplete="name"

«»

</div><div><label for="email">
Email
</label><input
id="email"
class="field"
type="email"
name="email"
placeholder="your@email.com"
maxlength="254"
required
autocomplete="email"

«»

</div></div><div class="row"><div><label for="country">
Country
</label><input
id="country"
class="field"
type="text"
name="country"
placeholder="Your country"
maxlength="100"
required
autocomplete="country-name"

«»

</div><div><label for="city">
City
</label><input
id="city"
class="field"
type="text"
name="city"
placeholder="Your city"
maxlength="100"
required
autocomplete="address-level2"

«»

</div></div><div class="message-header"><div class="message-label">
Your message
</div><div
id="counter"
class="counter"
>
0 / 4000
</div></div><textarea
id="message"
class="message-box"
name="message"
placeholder="Write your message here..."
maxlength="4000"
required
></textarea><button
id="submitButton"
class="submit"
type="submit"

«»

SEND MESSAGE
</button>

<div
id="status"
class="status"
aria-live="polite"
></div></form><div class="notice">Your email is collected for message submission
and should not be displayed publicly unless you choose
to make it visible later.

</div></div></div><script>

const MAX_MESSAGE_LENGTH =
4000;

const form =
document.getElementById(
"messageForm"
);

const messageInput =
document.getElementById(
"message"
);

const counter =
document.getElementById(
"counter"
);

const statusElement =
document.getElementById(
"status"
);

const submitButton =
document.getElementById(
"submitButton"
);

const orderDisplay =
document.getElementById(
"orderDisplay"
);


// ==============================
// ORDER ID FROM URL
// ==============================

const params =
new URLSearchParams(
window.location.search
);

const orderId =
params.get(
"orderId"
);

if(orderId){

orderDisplay.textContent =
orderId;

}else{

orderDisplay.textContent =
"Not provided";

}


// ==============================
// MESSAGE COUNTER
// ==============================

function updateCounter(){

const length =
messageInput.value.length;

counter.textContent =
length +
" / " +
MAX_MESSAGE_LENGTH;

if(length >= 3800){

counter.classList.add(
"warning"
);

}else{

counter.classList.remove(
"warning"
);

}

}

messageInput.addEventListener(
"input",
updateCounter
);

updateCounter();


// ==============================
// FORM VALIDATION
// ==============================

function isBlank(value){

return !value
.replace(/\s/g,"")
.length;

}


form.addEventListener(
"submit",
async function(event){

event.preventDefault();

statusElement.textContent =
"";

const name =
document
.getElementById("name")
.value
.trim();

const email =
document
.getElementById("email")
.value
.trim();

const country =
document
.getElementById("country")
.value
.trim();

const city =
document
.getElementById("city")
.value
.trim();

const message =
messageInput
.value
.trim();


if(!name){

statusElement.textContent =
"Please enter your name.";

return;

}

if(!email){

statusElement.textContent =
"Please enter your email.";

return;

}

if(
!/^[^\s@]+@[^\s@]+\.[^\s@]+$/
.test(email)
){

statusElement.textContent =
"Please enter a valid email.";

return;

}

if(!country){

statusElement.textContent =
"Please enter your country.";

return;

}

if(!city){

statusElement.textContent =
"Please enter your city.";

return;

}

if(isBlank(message)){

statusElement.textContent =
"Please write a message.";

messageInput.focus();

return;

}

if(
message.length >
MAX_MESSAGE_LENGTH
){

statusElement.textContent =
"Your message is too long.";

return;

}


submitButton.disabled =
true;

submitButton.textContent =
"SENDING...";


statusElement.textContent =
"Preparing your message...";


setTimeout(
function(){

submitButton.disabled =
false;

submitButton.textContent =
"SEND MESSAGE";

statusElement.textContent =
"Ready for the next step.";

},
700
);

}
);


// ==============================
// UNSAVED MESSAGE WARNING
// ==============================

let hasTyped =
false;

messageInput.addEventListener(
"input",
function(){

hasTyped =
messageInput.value
.trim()
.length > 0;

}
);

window.addEventListener(
"beforeunload",
function(event){

if(hasTyped){

event.preventDefault();

event.returnValue =
"";

}

}
);

</script></body>
</html>
