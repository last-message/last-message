<style>

*{

}

body{
    margin:0;
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.container{
    width:90%;
    max-width:700px;
}

.symbol{
    font-size:65px;

    text-shadow:
        0 0 35px red;
}

.logo{
    font-size:14px;

    letter-spacing:8px;

    color:#ffbbbb;

    margin-top:20px;
}

h1{
    font-size:55px;

    font-weight:900;

    margin:30px 0;

    text-shadow:
        0 0 20px red;
}

.card{
    padding:45px 30px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:35px;

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 0 70px
        rgba(0,0,0,.8);
}

.amount{
    font-size:80px;

    font-weight:900;
}

.network{
    font-size:28px;

    font-weight:900;

    color:#ffcccc;

    margin:20px;
}

.info{
    font-size:20px;

    line-height:1.8;
}

.wallet{
    margin-top:25px;

    padding:20px;

    background:
        rgba(0,0,0,.5);

    border-radius:20px;

    font-size:18px;

    word-break:break-all;

    border:
        1px solid
        rgba(255,255,255,.2);
}

.order{
    margin-top:20px;

    font-size:16px;

    word-break:break-all;
}

.txid-box{
    margin-top:25px;
}

.txid-input{
    width:100%;

    padding:18px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.5);

    color:white;

    font-size:16px;

    outline:none;
}

.txid-input:focus{
    border-color:
        rgba(255,255,255,.55);

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.08);
}

.txid-input::placeholder{
    color:#aaa;
}

button{
    margin-top:25px;

    padding:22px 60px;

    border:none;

    border-radius:60px;

    background:white;

    color:#700000;

    font-size:22px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 0 35px
        rgba(255,255,255,.3);

    transition:
        transform .2s,
        opacity .2s,
        box-shadow .2s;
}

button:hover:not(:disabled){

        scale(1.04);
}

button:active:not(:disabled){

<body>


<main class="container">

<div
    class="symbol"
    aria-hidden="true"
>
◈ ✦ ∞
</div>


<div class="logo">
GLOBAL HUMAN CONNECTION
</div>

SECURE PAYMENT
</h1>


<section
    class="card"
    aria-label="USDT TRC20 payment"
>

<div class="amount">
$2
</div>


<div class="network">
USDT TRC20
</div>


<div class="info">

Send exactly <b>2 USDT</b><br>

Network:
<b>TRON (TRC20)</b>

</div>


<div
    class="wallet"
    id="walletAddress"
>
TDq9HhTWvAB1Pft7pum4Ty5k9Kyb2adHdx
</div>

Order ID:
<strong id="orderId">
Creating...
</strong>

</div>


<button
    id="copyButton"
    type="button"
    onclick="copyWallet()"
>
COPY WALLET ADDRESS
</button>


<div class="txid-box">

<input
    id="txidInput"
    class="txid-input"
    type="text"
    inputmode="text"
    maxlength="64"
    placeholder="Enter transaction hash after payment"
    autocomplete="off"
    spellcheck="false"
    aria-label="Transaction hash"
>


<button
    id="verifyButton"
    class="verify-button"
    type="button"
    onclick="verifyPayment()"
    disabled
>
VERIFY PAYMENT
</button>

</div>


<div class="warning">

Only send USDT on TRC20 network.<br>

Sending another network may result in loss.

</div>


<div
    class="status"
    id="status"
    aria-live="polite"
>
Creating your order...
</div>


</section>


</main>


<script>

"use strict";


/* =====================================================
   CONFIG
===================================================== */

const WORKER_URL =
    "https://soft-shape-5b8a.aaa6654292.workers.dev";

const PAYMENT_ADDRESS =
    "TDq9HhTWvAB1Pft7pum4Ty5k9Kyb2adHdx";

const TXID_REGEX =
    /^[a-fA-F0-9]{64}$/;


/* =====================================================
   STATE
===================================================== */

let orderId = null;

let orderCreated = false;

let verificationInProgress = false;

let lastVerificationTime = 0;

const VERIFY_COOLDOWN_MS =
    5000;


/* =====================================================
   ELEMENTS
===================================================== */

const orderIdElement =
    document.getElementById(
        "orderId"
    );

const txidInput =
    document.getElementById(
        "txidInput"
    );

const copyButton =
    document.getElementById(
        "copyButton"
    );

const verifyButton =
    document.getElementById(
        "verifyButton"
    );

const statusElement =
    document.getElementById(
        "status"
    );


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    message,
    type = ""
){

    statusElement.textContent =
        message;

    statusElement.className =
        "status";

    if(type){

        statusElement.classList.add(
            type
        );

    }

}


/* =====================================================
   COPY WALLET
===================================================== */

async function copyWallet(){

    try{

        await navigator.clipboard.writeText(
            PAYMENT_ADDRESS
        );

        const original =
            copyButton.textContent;

        copyButton.textContent =
            "COPIED";

        setStatus(
            "Wallet address copied.",
            "success"
        );

        setTimeout(
            function(){

                copyButton.textContent =
                    original;

            },
            1800
        );

    }catch(error){

        console.error(
            "COPY ERROR:",
            error
        );

        setStatus(
            "Could not copy the wallet address.",
            "error"
        );

    }

}


/* =====================================================
   CREATE ORDER
===================================================== */

async function createOrder(){

    if(orderCreated){

        return;

    }


    setStatus(
        "Creating your order..."
    );


    try{

        const response =
            await fetch(
                WORKER_URL +
                "/create-order",
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        let result;


        try{

            result =
                await response.json();

        }catch{

            throw new Error(
                "Invalid server response."
            );

        }


        if(!response.ok){

            throw new Error(
                "Order could not be created."
            );

        }


        if(
            !result ||
            typeof result.orderId !== "string" ||
            !result.orderId
        ){

            throw new Error(
                "Invalid order response."
            );

        }


        orderId =
            result.orderId;

        orderCreated =
            true;


        orderIdElement.textContent =
            orderId;


        verifyButton.disabled =
            false;


        setStatus(
            "Waiting for payment..."
        );


    }catch(error){

        console.error(
            "ORDER CREATION ERROR:",
            error
        );


        orderId =
            null;

        orderCreated =
            false;


        orderIdElement.textContent =
            "ERROR";


        verifyButton.disabled =
            true;


        setStatus(
            "Could not create an order. Please refresh the page.",
            "error"
        );

    }

}


/* =====================================================
   VERIFY PAYMENT
===================================================== */

async function verifyPayment(){

    if(
        verificationInProgress
    ){

        return;

    }


    if(!orderId){

        setStatus(
            "Order ID is not ready yet.",
            "error"
        );

        return;

    }


    const txid =
        txidInput.value.trim();


    if(!txid){

        setStatus(
            "Please enter your transaction hash.",
            "error"
        );

        txidInput.focus();

        return;

    }


    if(!TXID_REGEX.test(txid)){

        setStatus(
            "Invalid transaction hash.",
            "error"
        );

        txidInput.focus();

        return;

    }


    const now =
        Date.now();


    if(
        now -
        lastVerificationTime <
        VERIFY_COOLDOWN_MS
    ){

        setStatus(
            "Please wait a few seconds before trying again."
        );

        return;

    }


    verificationInProgress =
        true;

    lastVerificationTime =
        now;


    verifyButton.disabled =
        true;

    txidInput.disabled =
        true;


    setStatus(
        "Verifying transaction..."
    );


    try{

        const response =
            await fetch(
                WORKER_URL +
                "/verify-payment",
                {
                    method:"POST",

                    cache:"no-store",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        orderId:
                            orderId,

                        txid:
                            txid

                    })
                }
            );


        let result;


        try{

            result =
                await response.json();

        }catch{

            throw new Error(
                "Invalid server response."
            );

        }


        console.log(
            "Payment verification status:",
            response.status
        );


        if(
            response.ok &&
            result &&
            result.paid === true
        ){

            setStatus(
                "✓ PAYMENT CONFIRMED",
                "success"
            );


            txidInput.disabled =
                true;

            verifyButton.disabled =
                true;


            return;

        }


        if(
            result &&
            result.paid === false
        ){

            setStatus(
                "Payment has not been confirmed yet. Please wait for the transaction to be confirmed on the TRON network."
            );


            return;

        }


        if(
            response.status === 409
        ){

            setStatus(
                "This transaction cannot be used for this order.",
                "error"
            );


            return;

        }


        setStatus(
            "Payment could not be verified yet. Please try again.",
            "error"
        );


    }catch(error){

        console.error(
            "PAYMENT VERIFICATION ERROR:",
            error
        );


        setStatus(
            "Could not verify the payment. Please try again.",
            "error"
        );

    }finally{

        verificationInProgress =
            false;


        txidInput.disabled =
            false;


        verifyButton.disabled =
            !orderId;

    }

}


/* =====================================================
   TXID INPUT
===================================================== */

txidInput.addEventListener(
    "input",
    function(){

        const value =
            txidInput.value.trim();


        if(
            value.length > 64
        ){

            txidInput.value =
                value.slice(
                    0,
                    64
                );

        }

    }
);


/* =====================================================
   START
===================================================== */

createOrder();

</script>


</body>
