font-size:
clamp(42px,5vw,64px);

letter-spacing:-1.5px;

12px 0 10px;

}

}

}

.message-box{

padding:30px;

white-space:pre-wrap;

overflow-wrap:anywhere;

box-shadow:

}

.actions{

}

color:#680000;

cursor:pointer;

box-shadow:
0 12px 40px
rgba(0,0,0,.35);

transition:
transform .2s,
box-shadow .2s,
opacity .2s;
}

.button:hover{
transform:
translateY(-2px);

box-shadow:
0 16px 45px
rgba(0,0,0,.45);
}

.button:active{

translateY(0);
}

.button:disabled{
opacity:.5;

cursor:not-allowed;

}

margin-top:22px;

}

.notice{
margin-top:28px;

18px 22px;

background:
rgba(0,0,0,.22);

}

padding:

}

.meta{

}

.message-box{
min-height:330px;

padding:23px;

font-size:17px;
}

}

@media(max-width:600px){

body{
padding:

}

}

}

h1{

}

.subtitle{
font-size:15px;

margin-bottom:30px;
}

.card{

28px 18px;

}

.meta-box{

15px 16px;
}

.message-box{
min-height:300px;

padding:19px;

border-radius:17px;
}

}

}

}

</style></head><body><div class="container"><div class="symbol">
◈ ✦ ∞
</div><div class="logo">
GLOBAL HUMAN CONNECTION
</div><h1>
LAST HUMAN MESSAGE
</h1><div class="subtitle">
One message. One person. One moment.
</div><div class="card"><div
id="messageNumber"
class="message-number"
>
MESSAGE
</div><div class="meta"><div class="meta-box"><div class="meta-label">
Name
</div><div
id="name"
class="meta-value"
>
Loading...
</div></div><div class="meta-box"><div class="meta-label">
Location
</div><div
id="location"
class="meta-value"
>
Loading...
</div></div></div><div
id="messageBox"
class="message-box"
>
Loading message...
</div><div class="actions"><button
id="previousButton"
class="button"
onclick="loadPreviousMessage()"
disabled

«»

PREVIOUS MESSAGE
</button>

</div><div
id="status"
class="status"
aria-live="polite"
>
Loading message...
</div><div class="notice">
This message was left by another person.
The previous message belongs to the person who came before them.
</div></div></div><script>

const WORKER_URL =
"https://soft-shape-5b8a.aaa6654292.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const messageNumberElement =
document.getElementById(
"messageNumber"
);

const nameElement =
document.getElementById(
"name"
);

const locationElement =
document.getElementById(
"location"
);

const messageBox =
document.getElementById(
"messageBox"
);

const previousButton =
document.getElementById(
"previousButton"
);

const statusElement =
document.getElementById(
"status"
);


/* =====================================================
   GET MESSAGE ID
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

let messageId =
params.get("messageId");


/* =====================================================
   LOAD MESSAGE
===================================================== */

async function loadMessage(){

if(!messageId){

messageNumberElement.textContent =
"INVALID MESSAGE";

nameElement.textContent =
"—";

locationElement.textContent =
"—";

messageBox.textContent =
"No message ID was provided.";

statusElement.textContent =
"Missing message ID.";

previousButton.disabled =
true;

return;

}


statusElement.textContent =
"Loading message...";

previousButton.disabled =
true;


try{

const response =
await fetch(

WORKER_URL +
"/get-message?messageId=" +
encodeURIComponent(messageId),

{
method:"GET",
cache:"no-store"
}

);


let result;

try{

result =
await response.json();

}catch{

throw new Error(
"Worker returned an invalid response."
);

}


console.log(
"GET MESSAGE:",
result
);


if(!response.ok){

throw new Error(
result.error ||
"Message could not be loaded."
);

}


if(
result.success !== true ||
!result.message
){

throw new Error(
"Message data is unavailable."
);

}


displayMessage(
result.message
);


/* ---------------------------------------------
   Check whether previous message exists
--------------------------------------------- */

if(
result.message.previousMessageId
){

previousButton.disabled =
false;

statusElement.textContent =
"Message loaded.";

}else{

previousButton.disabled =
true;

statusElement.textContent =
"This is the first message.";

}


}catch(error){

console.error(
"LOAD MESSAGE ERROR:",
error
);

messageNumberElement.textContent =
"MESSAGE NOT FOUND";

nameElement.textContent =
"—";

locationElement.textContent =
"—";

messageBox.textContent =
error.message ||
"Could not load this message.";

previousButton.disabled =
true;

statusElement.textContent =
error.message ||
"Could not load message.";

}

}


/* =====================================================
   DISPLAY MESSAGE
===================================================== */

function displayMessage(message){

const number =
message.messageNumber ||
"—";

const name =
message.name ||
"Anonymous";

const country =
message.country ||
"";

const city =
message.city ||
"";


messageNumberElement.textContent =
"MESSAGE #" +
number;


nameElement.textContent =
name;


if(
country &&
city
){

locationElement.textContent =
city +
", " +
country;

}else if(country){

locationElement.textContent =
country;

}else if(city){

locationElement.textContent =
city;

}else{

locationElement.textContent =
"—";

}


messageBox.textContent =
message.message ||
"";


}


/* =====================================================
   LOAD PREVIOUS MESSAGE
===================================================== */

async function loadPreviousMessage(){

if(!messageId){

return;

}


previousButton.disabled =
true;

previousButton.textContent =
"LOADING PREVIOUS MESSAGE...";

statusElement.textContent =
"Loading previous message...";


try{

const response =
await fetch(

WORKER_URL +
"/previous-message?messageId=" +
encodeURIComponent(messageId),

{
method:"GET",
cache:"no-store"
}

);


let result;

try{

result =
await response.json();

}catch{

throw new Error(
"Worker returned an invalid response."
);

}


console.log(
"PREVIOUS MESSAGE:",
result
);


if(!response.ok){

throw new Error(
result.error ||
"Could not load previous message."
);

}


if(
result.hasPrevious !== true ||
!result.message
){

previousButton.disabled =
true;

previousButton.textContent =
"NO PREVIOUS MESSAGE";

statusElement.textContent =
"This is the first message.";

return;

}


/* ---------------------------------------------
   Move to previous message
--------------------------------------------- */

messageId =
result.message.messageId;


/*
 * Update browser URL without
 * reloading the entire page.
 */

const newUrl =
window.location.pathname +
"?messageId=" +
encodeURIComponent(messageId);


window.history.pushState(
{},
"",
newUrl
);


displayMessage(
result.message
);


/*
 * Check if the newly loaded message
 * has another previous message.
 */

if(
result.message.previousMessageId
){

previousButton.disabled =
false;

previousButton.textContent =
"PREVIOUS MESSAGE";

statusElement.textContent =
"Previous message loaded.";

}else{

previousButton.disabled =
true;

previousButton.textContent =
"NO PREVIOUS MESSAGE";

statusElement.textContent =
"This is the first message.";

}


}catch(error){

console.error(
"PREVIOUS MESSAGE ERROR:",
error
);

statusElement.textContent =
error.message ||
"Could not load previous message.";

previousButton.disabled =
false;

previousButton.textContent =
"PREVIOUS MESSAGE";

}

}


/* =====================================================
   BROWSER BACK / FORWARD
===================================================== */

window.addEventListener(
"popstate",
function(){

const newParams =
new URLSearchParams(
window.location.search
);

messageId =
newParams.get("messageId");

loadMessage();

}
);


/* =====================================================
   START
===================================================== */

loadMessage();

</script></body></html>
